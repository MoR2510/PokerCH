<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Poker 4D - Premium Edition</title>
    <style>
        body { background: #060a12; color: white; font-family: sans-serif; text-align: center; }
        .chip { padding: 10px; margin: 5px; border-radius: 50%; display: inline-block; background: gold; color: black; font-weight: bold; }
        #game-area { margin-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff4500; border: none; color: white; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Poker 4D</h1>
    <div id="player-balance">הכסף שלך: <span id="balance">1000</span>$</div>
    <div id="game-area"></div>
    <button onclick="newTable()">New Table</button>

    <script>
        let balance = parseInt(localStorage.getItem('pokerBalance')) || 1000;
        document.getElementById('balance').innerText = balance;

        const names = ["אבי", "בני", "גדי", "דני", "יוסי", "אלי", "רוני", "קובי", "משה", "חיים", "שי", "יניב", "ערן", "טל", "גל"];
        
        function getRandomName() { return names[Math.floor(Math.random() * names.length)] + (Math.floor(Math.random() * 999)); }

        function newTable() {
            let area = document.getElementById('game-area');
            area.innerHTML = "<h3>שחקנים בשולחן:</h3>";
            for(let i=0; i<4; i++) {
                let money = Math.floor(Math.random() * (1500 - 500 + 1)) + 500;
                area.innerHTML += `<div class='chip'>${getRandomName()} (${money}$)</div>`;
            }
            area.innerHTML += `<br><br><button onclick="winGame()">נצח סיבוב</button>`;
        }

        function winGame() {
            balance += 500;
            localStorage.setItem('pokerBalance', balance);
            document.getElementById('balance').innerText = balance;
            alert("ניצחת! עובר לשולחן הבא...");
            newTable();
        }

        newTable();
    </script>
</body>
</html>
